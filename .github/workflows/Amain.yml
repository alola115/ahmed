name: RDP-Alternative

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389

      - name: Create RDP User with Secure Password
        run: |
          $password = "BoraiGamer2026!" # حط باسوورد قوي هنا عشان تدخل بيه
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Download and Extract Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/b341edd51de/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "."

      - name: Start Ngrok Tunnel
        run: |
          # حط التوكن بتاع حساب نجروك المجاني بتاعك في الـ Secrets باسم NGROK_AUTH_TOKEN
          .\ngrok.exe config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
          Start-Process .\ngrok.exe -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 10

      - name: Get RDP Address and Maintain Connection
        run: |
          # هنجيب الرابط الخارجي اللي نجروك عمله عشان تدخل بيه
          $ngrokUrl = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels").tunnels.public_url
          $cleanUrl = $ngrokUrl -replace "tcp://", ""
          
          Write-Host "`n=========================================="
          Write-Host "RDP Address: $cleanUrl"
          Write-Host "Username: RDP"
          Write-Host "==========================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Server is Live..."
              Start-Sleep -Seconds 300
          }
